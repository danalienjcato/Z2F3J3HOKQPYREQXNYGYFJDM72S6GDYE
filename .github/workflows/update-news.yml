name: Update official economic news
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - 'scripts/update_reactions.py'
      - '.github/workflows/update-news.yml'
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official feeds
        run: python scripts/update_news.py
      - name: Calculate historical gold reactions
        run: python scripts/update_reactions.py
      - name: Publish new data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json reactions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official economic news"
            git pull --rebase -X ours origin main
            git push
          fi
